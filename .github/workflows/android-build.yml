name: Build MotoCam G37 APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r27 & CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK (with Native C++17 NEON ISP Engine)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
        run: gradle assembleDebug --stacktrace

      - name: Upload Compiled MotoCam G37 APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoCam-G37-APK
          path: app/build/outputs/apk/debug/app-debug.apk
